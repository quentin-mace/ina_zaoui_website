name: CI workflow
on:
  pull_request:

env:
  PHP_VERSION: '8.4'

jobs:
  build:
    name: 🔧 Build Environment
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: 📚 Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts
      - name: 📤 Create artifact
        uses: actions/upload-artifact@v4
        with:
          name: symfony-env
          path: |
            vendor/
            var/cache/test/
            public/build/
          retention-days: 1

  phpstan:
    name: 🔎 PHPStan static analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: symfony-env
      - name: 🔎 Run PHPStan
        run: php vendor/bin/phpstan analyse --no-progress --error-format=github

  cs-fixer:
    name: ✨ Code Style (PHP-CS-Fixer)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: symfony-env
      - name: ✨ Run PHP-CS-Fixer
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

  phpunit:
    name: 🧪 Unit tests with PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: critipixel
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: 📚 Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts
      - name: 🗄️ Create database
        run: php bin/console doctrine:database:create --env=test
      - name: 🔄 Run migrations
        run: php bin/console doctrine:migrations:migrate -n --env=test
      - name: 🌱 Load fixtures
        run: php bin/console doctrine:fixtures:load -n --env=test
      - name: 🧪 Run PHPUnit
        run: php vendor/bin/phpunit
